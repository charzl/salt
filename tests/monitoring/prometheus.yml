global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'salt-fds'
    static_configs:
      - targets: ['salt-master:8002']

  # OpenTelemetry metrics (only present when the master runs with SALT_METRICS=on)
  - job_name: 'salt-otel'
    static_configs:
      - targets: ['salt-master:9464']
