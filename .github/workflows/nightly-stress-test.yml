name: Nightly Stress Test
run-name: "Nightly Stress Test (branch: ${{ github.ref_name }})"

# Branch schedulers on the default branch dispatch each target via --ref.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: Stress test duration (GitHub-hosted runner caps at 6h)
        required: true
        default: '0.5h'
        type: choice
        options:
          # 20m is the minimum: analyze_stats.py ignores the first 10
          # minutes (warm-up) and the last 2, and needs at least 8 more
          # for a meaningful RSS/FD slope.
          - '20m'
          - '0.5h'
          - '1h'
          - '1.5h'
          - '2h'
          - '2.5h'
          - '3h'
          - '3.5h'
          - '4h'
          - '4.5h'
          - '5h'
          - '5.5h'
      enable_metrics:
        description: Enable OpenTelemetry metrics (metrics.enabled)
        required: false
        default: false
        type: boolean
      worker_threads:
        description: Salt master worker_threads
        required: false
        default: '5'
        type: string
      metrics_exporter:
        description: metrics.exporter used when enable_metrics is true
        required: false
        default: otlp-http
        type: choice
        options:
          - otlp-http
          - prometheus
      profiler:
        description: >
          Profile one process during the run.  Adds overhead (memray a lot),
          so use it for manual runs only.  It never changes pass or fail.
        required: false
        default: none
        type: choice
        options:
          - none
          - memray
          - austin
          - py-spy
      profile_target:
        description: >
          Process to profile when profiler is set.  master is the main process,
          which mostly supervises; use mworker (MWorker-default-0) to look for
          memory growth.
        required: false
        default: master
        type: choice
        options:
          - master
          - mworker
          - minion
      profile_minutes:
        description: >
          Minutes to profile when profiler is set.  Profiling starts after the
          10 minute warm-up, so it must fit in the run.
        required: false
        default: '10'
        type: string

jobs:
  stress-test:
    runs-on: ubuntu-latest
    # Repo-level opt-out, shared with the default branch's nightly dispatcher.
    if: vars.SKIP_NIGHTLY_STRESS_TEST != 'true'
    # ``contents: write`` lets the ``Publish panels to stress-snapshots
    # branch`` step push the rendered PNGs to an orphan branch so the
    # step summary can embed them via raw.githubusercontent.com URLs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref_name }}-

      - name: Build and Start Environment
        env:
          PROFILER: ${{ github.event.inputs.profiler || 'none' }}
        run: |
          cd tests/monitoring
          if [ "$PROFILER" != "none" ]; then
            # memray, Austin and py-spy attach from outside the process and
            # need SYS_PTRACE in the container.  Only profiling runs get it.
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.profiling.yml" >> "$GITHUB_ENV"
            export COMPOSE_FILE=docker-compose.yml:docker-compose.profiling.yml
          fi
          # The prometheus container runs as ``nobody`` (uid 65534) and
          # writes its TSDB to ``/prometheus``.  Without pre-creating the
          # bind-mount source with that ownership, Docker creates it
          # owned by root and prometheus fails to start with "permission
          # denied", which then shows up as a ConnectionRefusedError in
          # analyze_stats.py.  (Same fix as on master.)
          mkdir -p prometheus_data
          sudo chown -R 65534:65534 prometheus_data
          docker compose build
          docker compose up -d
          sleep 30 # Wait for initialization

      - name: Configure salt-master
        # Apply the workflow_dispatch overrides to ``master.conf`` and,
        # if anything actually changed, restart salt-master so it picks
        # them up.  ``metrics.enabled`` gates the entire
        # ``salt.utils.metrics`` stack (including the ``_load_otel``
        # deferred OpenTelemetry import); the pip package on disk has
        # zero runtime cost when this gate is off, so a config toggle
        # is all that is needed to measure the OTel-on vs OTel-off
        # profile.  ``worker_threads`` sizes the MWorker pool and lets
        # a run sweep the parallelism / RSS trade-off.
        env:
          ENABLE_METRICS: ${{ github.event.inputs.enable_metrics || 'false' }}
          WORKER_THREADS: ${{ github.event.inputs.worker_threads || '5' }}
          METRICS_EXPORTER: ${{ github.event.inputs.metrics_exporter || 'otlp-http' }}
        run: |
          cd tests/monitoring
          need_restart=0

          if [ "$ENABLE_METRICS" = "true" ]; then
            echo "Enabling OpenTelemetry metrics on salt-master"
            # Append the metrics block only if not already present so
            # re-runs are idempotent.  ``printf`` (not a heredoc) keeps
            # the YAML block-scalar indentation intact.
            if ! grep -q '^metrics:' master.conf; then
              if [ "$METRICS_EXPORTER" = "prometheus" ]; then
                # Listen on all interfaces so the prometheus container
                # can scrape ``salt-master:9464``.
                printf '\nmetrics:\n  enabled: true\n  exporter: prometheus\n  prometheus:\n    host: 0.0.0.0\n    port: 9464\n' >> master.conf
              else
                printf '\nmetrics:\n  enabled: true\n' >> master.conf
              fi
              need_restart=1
            fi
          else
            echo "Leaving metrics.enabled at default (false); OTel package is"
            echo "shipped but never imported by the lazy loader."
          fi

          # Update ``worker_threads`` only when it differs from the value
          # already in the file, so unchanged defaults skip the restart.
          current_workers=$(awk '/^worker_threads:/ {print $2}' master.conf)
          if [ -n "$current_workers" ] && [ "$current_workers" != "$WORKER_THREADS" ]; then
            echo "Setting worker_threads: $current_workers -> $WORKER_THREADS"
            sed -i "s/^worker_threads:.*/worker_threads: $WORKER_THREADS/" master.conf
            need_restart=1
          fi

          if [ "$need_restart" = "1" ]; then
            docker restart salt-master
            sleep 20
          fi

          if [ "$ENABLE_METRICS" = "true" ]; then
            # Trigger a code path that calls ``metrics.configure`` so
            # the OpenTelemetry import fires and any misconfiguration
            # surfaces here rather than mid-stress.
            docker exec salt-master python3 -c \
              "import salt.utils.metrics as m; m._load_otel(); assert m._OTEL_AVAILABLE, 'OTel import failed'"
          fi

      - name: Verify Connections
        run: |
          docker exec salt-master salt '*' test.ping

      - name: Start profiler
        # Runs inside the container, in the background.  It waits for the
        # warm-up (the same 10 minutes analyze_stats.py leaves out), profiles
        # for ``profile_minutes`` and writes to /tmp/profile.  The result is
        # copied out by ``Collect profile`` after the leak check, so the
        # profiler cannot change the length of the analysis window.
        if: github.event.inputs.profiler != '' && github.event.inputs.profiler != 'none'
        continue-on-error: true
        env:
          PROFILER: ${{ github.event.inputs.profiler }}
          PROFILE_TARGET: ${{ github.event.inputs.profile_target || 'master' }}
          PROFILE_MINUTES: ${{ github.event.inputs.profile_minutes || '10' }}
          DURATION: ${{ github.event.inputs.duration || '0.5h' }}
        run: |
          cd tests/monitoring
          WARMUP=600
          # Seconds in the run, from "30m" or "1.5h".
          RUN_SECONDS=$(python3 -c "import sys; d = sys.argv[1]; print(int(float(d[:-1]) * (3600 if d.endswith('h') else 60)))" "$DURATION")
          SECONDS_TO_PROFILE=$((PROFILE_MINUTES * 60))
          # Leave two minutes at the end for the profiler to finish.
          MAX_SECONDS=$((RUN_SECONDS - WARMUP - 120))
          if [ "$SECONDS_TO_PROFILE" -gt "$MAX_SECONDS" ]; then
            echo "profile_minutes=$PROFILE_MINUTES does not fit in a $DURATION run; using $((MAX_SECONDS / 60)) minutes"
            SECONDS_TO_PROFILE=$MAX_SECONDS
          fi
          CONTAINER=salt-master
          if [ "$PROFILE_TARGET" = "minion" ]; then
            CONTAINER=salt-minion-1
          fi
          docker cp profile.sh "$CONTAINER":/tmp/profile.sh
          docker cp profile_report.py "$CONTAINER":/tmp/profile_report.py
          docker exec -d \
            -e PROFILER="$PROFILER" -e TARGET="$PROFILE_TARGET" \
            -e DELAY="$WARMUP" -e PROFILE_SECONDS="$SECONDS_TO_PROFILE" \
            -e OUT=/tmp/profile \
            "$CONTAINER" bash /tmp/profile.sh
          echo "Profiling $PROFILE_TARGET with $PROFILER for $((SECONDS_TO_PROFILE / 60)) minutes after ${WARMUP}s in $CONTAINER"

      - name: Run Aggressive Stress Test
        run: |
          cd tests/monitoring
          chmod +x stress_test.sh stress_api.sh
          # analyze_stats.py skips the first 10 minutes after this point
          echo "STRESS_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          # Run in background and wait for defined duration
          ./stress_test.sh &
          STRESS_PID=$!

          # Default to 30m if not workflow_dispatch
          DURATION="${{ github.event.inputs.duration || '0.5h' }}"
          echo "Running stress test for $DURATION..."

          # Use sleep with suffix support (m, h)
          sleep $DURATION

          echo "Stopping stress test..."
          pkill -P $STRESS_PID || true
          kill $STRESS_PID || true

      - name: Show the master's own metrics
        if: always() && github.event.inputs.enable_metrics == 'true' && github.event.inputs.metrics_exporter == 'prometheus'
        run: |
          mkdir -p artifacts
          docker exec salt-master python3 -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:9464/metrics', timeout=10).read().decode())" \
            > artifacts/salt-metrics.txt || true
          # One file per process that has written metrics: the main
          # process plus every MWorker (and any that were replaced).
          docker exec salt-master sh -c 'ls -la /tmp/salt-metrics-*/' \
            > artifacts/salt-metrics-dir.txt || true
          grep -E '^salt_' artifacts/salt-metrics.txt | head -40 || true
          cat artifacts/salt-metrics-dir.txt || true

      - name: Analyze Results
        env:
          STRESS_PROFILER: ${{ github.event.inputs.profiler || 'none' }}
          EXPECT_SALT_PROMETHEUS_METRICS: ${{ (github.event.inputs.enable_metrics == 'true' && github.event.inputs.metrics_exporter == 'prometheus') && '1' || '0' }}
        run: |
          cd tests/monitoring
          # Give Prometheus a moment to finish scraping the final points
          sleep 30
          python3 analyze_stats.py

      - name: Render Dashboard Panels
        # Render BEFORE Snapshot Metrics stops prometheus.  We *only*
        # produce the PNGs here; the markdown step-summary that links
        # to them runs after the upload so it can embed a real URL.
        # Runs even if Analyze Results failed -- the graphs are usually
        # the most useful diagnostic for a failed run.
        if: always()
        run: |
          cd tests/monitoring
          python3 -m pip install --quiet matplotlib
          PANELS_DIR="${GITHUB_WORKSPACE}/artifacts/panels" \
            python3 render_panels.py

      - name: Collect profile
        # After Analyze Results on purpose, see ``Start profiler``.  Waits for
        # profile.sh to finish (memray builds its reports at the end), then
        # copies its output into artifacts/profile for the upload.
        if: always() && github.event.inputs.profiler != '' && github.event.inputs.profiler != 'none'
        continue-on-error: true
        env:
          PROFILE_TARGET: ${{ github.event.inputs.profile_target || 'master' }}
        run: |
          CONTAINER=salt-master
          if [ "$PROFILE_TARGET" = "minion" ]; then
            CONTAINER=salt-minion-1
          fi
          for _ in $(seq 1 60); do
            if docker exec "$CONTAINER" test -f /tmp/profile/done; then
              break
            fi
            sleep 10
          done
          mkdir -p artifacts/profile
          docker cp "$CONTAINER":/tmp/profile/. artifacts/profile/
          ls -la artifacts/profile

      - name: Snapshot Metrics
        if: always()
        run: |
          # Stop containers to ensure data is flushed to disk
          cd tests/monitoring
          docker compose stop prometheus
          sudo tar -czf ../../prometheus-data.tar.gz ./prometheus_data

      - name: Collect Logs on Failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker logs salt-master > artifacts/salt-master.log
          docker logs salt-minion-1 > artifacts/salt-minion-1.log
          cp monitoring/event_log.txt artifacts/ || true

      - name: Upload Artifacts
        id: upload-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results-${{ github.ref_name }}
          path: |
            artifacts/
            prometheus-data.tar.gz

      - name: Publish panels to stress-snapshots branch
        # GitHub's step-summary sanitizer strips ``data:`` URIs but
        # allows real ``https:`` image URLs, so we push the rendered
        # PNGs to a dedicated ``stress-snapshots`` branch and let the
        # summary embed them via ``raw.githubusercontent.com``.  The
        # branch is orphan-style: it never merges anywhere and is
        # auto-pruned 14 days back so it stays small.  Skipped silently
        # when no PNGs exist (e.g. early-stage failures).
        id: publish-snapshots
        if: always() && (hashFiles('artifacts/panels/*.png') != '' || hashFiles('artifacts/profile/*') != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH=stress-snapshots
          RUN_DIR="runs/${{ github.run_id }}/${{ github.ref_name }}"

          if git ls-remote --exit-code --heads "$REPO_URL" "$BRANCH" >/dev/null 2>&1; then
            git clone --depth=1 --branch="$BRANCH" "$REPO_URL" snaps
          else
            git clone --depth=1 "$REPO_URL" snaps
            cd snaps
            git switch --orphan "$BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi

          mkdir -p "snaps/$RUN_DIR"
          if compgen -G 'artifacts/panels/*.png' > /dev/null; then
            cp artifacts/panels/*.png "snaps/$RUN_DIR/"
          fi
          # Profiler output that can be read in the summary: SVG flamegraphs
          # (shown as images) and text.  raw.githubusercontent.com serves HTML
          # as text/plain, so the HTML flamegraphs and the large raw captures
          # stay in the uploaded artifact only.
          if [ -d artifacts/profile ]; then
            mkdir -p "snaps/$RUN_DIR/profile"
            find artifacts/profile -maxdepth 1 -type f \
              \( -name '*.svg' -o -name '*.txt' -o -name '*.log' \) -size -5120k \
              -exec cp {} "snaps/$RUN_DIR/profile/" \;
          fi

          cd snaps
          # Drop any run directory older than 14 days so the branch
          # never accumulates unbounded.
          find runs -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} + 2>/dev/null || true

          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add -A
          if ! git commit -m "Stress run ${{ github.run_id }}"; then
            echo "nothing to commit"
          else
            # Tiny retry loop in case two runs raced.  Cron is nightly
            # so this is essentially defensive.
            for attempt in 1 2 3; do
              if git push origin "$BRANCH"; then
                break
              fi
              echo "push attempt $attempt failed; rebasing"
              git fetch origin "$BRANCH"
              git rebase "origin/$BRANCH"
            done
          fi

          URL_PREFIX="https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH}/${RUN_DIR}/"
          echo "url-prefix=${URL_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "Published panels under ${URL_PREFIX}"

      - name: Panel Summary
        # Build the workflow step summary from the PNGs the Render
        # step already produced, NOT by re-querying prometheus -- by
        # this point ``Snapshot Metrics`` has stopped the prometheus
        # container, so every range query would return no data.
        # ``--image-url-prefix`` points at the stress-snapshots branch
        # so each panel renders inline; without it the summary falls
        # back to listing the artifact bundle.
        if: always()
        run: |
          cd tests/monitoring
          PANELS_DIR="${GITHUB_WORKSPACE}/artifacts/panels" \
            python3 render_panels.py --summary --from-existing \
              --artifact-name stress-test-results-${{ github.ref_name }} \
              --artifact-url "${{ steps.upload-artifacts.outputs.artifact-url }}" \
              --image-url-prefix "${{ steps.publish-snapshots.outputs.url-prefix }}"

      - name: Profile Summary
        # After ``Publish panels``, so the SVG flamegraph can be embedded
        # from the stress-snapshots branch.  The summary shows what can be
        # read inline.  The HTML flamegraphs (memray) and the raw captures
        # are in the uploaded artifact, in the ``profile`` folder.
        if: always() && github.event.inputs.profiler != '' && github.event.inputs.profiler != 'none'
        continue-on-error: true
        env:
          PROFILER: ${{ github.event.inputs.profiler }}
          PROFILE_TARGET: ${{ github.event.inputs.profile_target || 'master' }}
          URL_PREFIX: ${{ steps.publish-snapshots.outputs.url-prefix }}
          ARTIFACT_URL: ${{ steps.upload-artifacts.outputs.artifact-url }}
        run: |
          dir=artifacts/profile
          {
            echo "### Profile: ${PROFILER} on ${PROFILE_TARGET}"
            echo
            echo "Exit status: \`$(cat "$dir/exit_code" 2>/dev/null || echo unknown)\`."
            if [ -n "$ARTIFACT_URL" ]; then
              echo "Everything, including the HTML flamegraphs and the raw capture, is in the \`profile\` folder of [the artifact]($ARTIFACT_URL)."
            fi
            echo

            if [ -s "$dir/pyspy-flamegraph.svg" ] && [ -n "$URL_PREFIX" ]; then
              echo "![py-spy flamegraph](${URL_PREFIX}profile/pyspy-flamegraph.svg)"
              echo
            fi

            # The report in plain words comes first.
            if [ -s "$dir/report.md" ]; then
              cat "$dir/report.md"
              echo
            fi

            for name in memray-summary.txt memray-stats.txt pyspy-dump.txt; do
              if [ -s "$dir/$name" ]; then
                echo "<details><summary>$name (raw output of the tool)</summary>"
                echo
                echo '```'
                head -n 40 "$dir/$name"
                echo '```'
                echo '</details>'
                echo
              fi
            done

            if [ -s "$dir/austin.mojo" ]; then
              echo "Austin wrote \`austin.mojo\` ($(du -h "$dir/austin.mojo" | cut -f1)) in its binary MOJO format. Open it with the Austin VS Code extension; it is in the artifact."
              echo
            fi

            echo '<details><summary>profile.log</summary>'
            echo
            echo '```'
            tail -n 40 "$dir/profile.log" 2>/dev/null
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
