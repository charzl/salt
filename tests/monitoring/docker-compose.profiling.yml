# Added to docker-compose.yml by nightly-stress-test.yml (through COMPOSE_FILE)
# only when the ``profiler`` input is set.  memray, Austin and py-spy attach
# to a running process from the outside, which needs ptrace.  The default
# stress run does not use this file.
services:
  salt-master:
    cap_add:
      - SYS_PTRACE

  salt-minion-1:
    cap_add:
      - SYS_PTRACE
