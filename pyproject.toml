[build-system]
requires = [
    "setuptools>=64.0",
    "wheel",
    "looseversion",
    "packaging",
    "importlib-metadata>=8.7.0",
]
build-backend = "salt_build_backend"
backend-path = ["tools/pkg"]

[project]
name = "salt"
description = "Portable, distributed, remote execution and configuration management system"
readme = "README.rst"
requires-python = ">=3.8"
license = {text = "Apache Software License 2.0"}
authors = [
  {name = "Thomas S Hatch", email = "thatch45@gmail.com"},
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
]
dynamic = ["version", "dependencies", "optional-dependencies", "scripts", "entry-points"]

[project.urls]
Homepage = "https://saltproject.io"

[tool.black]
exclude= """
/(
    salt/ext
  | templates
)/
"""

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
ensure_newline_before_comments=true
skip="salt/ext,templates"
known_third_party = [
  "pytest"
]

[tool.ruff]
# Match the minimum Python version declared by this project.
target-version = "py38"
line-length = 88
extend-exclude = ["salt/ext", "templates"]

[tool.ruff.lint]
# Correctness checks, alongside Salt's pylint plugins. Black remains the
# formatter. Type checking is a separate rollout.
#
# Only new violations are blocking (see tools/precommit/ruff.py), so adding a
# rule here does not require cleaning up existing code.
select = [
    "F401",  # unused imports
    "F402",  # import shadowed by a loop variable
    "F541",  # f-strings without placeholders
    "F631",  # assertions with a non-empty tuple (always true)
    "F634",  # conditions with a non-empty tuple (always true)
    "F811",  # redefinition of an unused name
    "F841",  # unused local variables
    "E711",  # comparison to None with == or !=
    "E712",  # comparison to True or False with == or !=
    "E713",  # "not x in y" instead of "x not in y"
    "E714",  # "not x is y" instead of "x is not y"
    "E722",  # bare except
    "B005",  # strip() with a multi-character string
    "B006",  # mutable argument defaults
    "B011",  # assert False
    "B015",  # pointless comparison
    "B017",  # assertRaises(Exception) / pytest.raises(Exception)
    "B018",  # useless expression
    "B020",  # loop variable overrides the iterable
    "B023",  # loop variables captured without binding
    "B025",  # duplicate exception in a try statement
    "B904",  # raise inside except without "from"
]

[tool.towncrier]
    package = "salt"
    filename = "CHANGELOG.md"
    directory = "changelog/"
    template = "changelog/.template.jinja"
    start_string = "# Changelog\n"
    underlines = ["", "", ""]
    title_format = "## {version} ({project_date})"
    issue_format = "[#{issue}](https://github.com/saltstack/salt/issues/{issue})"

    [[tool.towncrier.type]]
        directory = "removed"
        name = "Removed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "deprecated"
        name = "Deprecated"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "changed"
        name = "Changed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "fixed"
        name = "Fixed"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "added"
        name = "Added"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "security"
        name = "Security"
        showcontent = true
